[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-runtime-from-scratch"
version = "0.1.0"
description = "A very small subset of Docker written from scratch in pure Python (namespaces, cgroups v2, overlayfs layers, pivot_root, capabilities, seccomp, netlink bridge networking, a registry client), checked against real Docker on Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
keywords = ["container", "docker", "namespaces", "cgroups", "overlayfs", "oci", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Operating System Kernels :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SafraNako/container-runtime-from-scratch"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
konteyner = "kendi_konteyner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
